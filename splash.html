#sp{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(120% 80% at 50% 42%,#1a4878 0%,#0d2a4d 45%,#071a31 100%);transition:opacity .45s ease;overflow:hidden}
#sp .lg{position:relative;width:min(34vw,140px);aspect-ratio:260/249}
#sp .lg img{position:relative;width:100%;height:100%;display:block;opacity:0;transform:translateY(14px) scale(.92);animation:spmark .9s cubic-bezier(.2,.9,.25,1) .1s forwards;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
#sp .glow{position:absolute;left:50%;top:46%;width:260%;height:260%;transform:translate(-50%,-50%) scale(.6);border-radius:50%;background:radial-gradient(closest-side,rgba(255,214,120,.34),rgba(255,214,120,.1) 55%,rgba(255,214,120,0));opacity:0;animation:spglow 1.4s ease-out .5s forwards}
#sp h1{margin:8px 0 0;font:600 clamp(40px,11vw,58px)/1 JCinzel,Cinzel,Georgia,serif;letter-spacing:.12em;padding-left:.12em;color:#e8c46a}
#sp h1 span{display:inline-block;opacity:0;transform:translateY(10px);animation:sptx .5s ease-out forwards}
#sp i{display:block;width:140px;height:1px;margin:14px 0 10px;background:linear-gradient(90deg,transparent,#e8c46a,transparent);opacity:0;animation:sptx .5s ease-out 1.5s forwards}
#sp p{margin:0;font:italic 18px Georgia,serif;color:rgba(243,234,214,.9);opacity:0;animation:sptx .6s ease-out 1.7s forwards}
@keyframes spmark{to{opacity:1;transform:none}}
@keyframes spglow{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes sptx{to{opacity:1;transform:none}}
#sp.wait .lg{animation:sppulse 1.6s ease-in-out infinite}
@keyframes sppulse{50%{opacity:.7}}
#sp.out{opacity:0}
@media (prefers-reduced-motion:reduce){#sp *{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
