<style>
/* Layout: sticky toolbar; reading column on the left, study panel on the right (bottom sheet on phones).

  --hl-gold:rgba(220,180,80,.28); --hl-blue:rgba(110,160,230,.28); --hl-green:rgba(100,190,130,.26); --hl-rose:rgba(230,120,140,.26);
  --shadow:0 10px 30px rgba(0,0,0,.45); --water:#142231; --land:#27231d; --coast:#433c31; --river:#4b79a6; --region:#86aee6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08142a; --surface:#0f1f3a; --paper:#0f1f3a; --fg:#ece6d8; --muted:#a2abbd; --line:#22365a;
  --accent:#e3b54a; --accent-ink:#08142a; --accent-soft:#1d2c46; --gold:#e8bd55; --gold-soft:#2a2c2c; --brand:#e8bd55; --logo-gold:#e8bd55; --ol:#8fb3e8;
  --hl-gold:rgba(220,180,80,.28); --hl-blue:rgba(110,160,230,.28); --hl-green:rgba(100,190,130,.26); --hl-rose:rgba(230,120,140,.26);
  --shadow:0 10px 30px rgba(0,0,0,.45); --water:#142231; --land:#27231d; --coast:#433c31; --river:#4b79a6; --region:#86aee6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5}

button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
a{color:var(--accent)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}

  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px}

.linkcard{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:4px 0;text-decoration:none;font-size:13px;background:var(--surface)}

}

/* Printed-scripture page */

.home{display:flex;flex-direction:column;gap:36px}
